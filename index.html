<header class="topbar"><a class="brand" href="#"><span class="brand-icon">✳</span><span>PROJECT<span class="brand-sub">UNIVERSE</span></span></a><nav aria-label="页面"><button data-view="universe" class="active">项目宇宙</button><button data-view="list">项目总览</button><button data-view="weekly">本周更新</button><button data-view="quality">资料核验</button></nav><div class="top-actions"><span id="saveStatus" class="save-status"></span><button id="dataMenuButton" class="outline">数据与导出 ↗</button></div></header>
<main><section class="heading"><div><p class="eyebrow">YOUR COMPANIES. ONE CONNECTED VIEW.</p><h1 id="pageTitle">把每个项目，放回全景。</h1><p id="pageDescription">看清领域与来源，串起人物和学校，记住每一次进展。</p></div><div class="version"><span class="live-dot"></span> 本地研究版 <span id="version"></span><small id="dataNote">内部记录的原始更新日期待核实</small></div></section>
<section id="stats" class="stats"></section>
<section class="filters"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索公司、产品、教授、学校…" aria-label="搜索项目"><kbd>/</kbd></label><select id="investFilter" aria-label="投资标签"><option value="">全部投资标签</option><option value="invested">已投</option><option value="uninvested">未投</option><option value="exited">历史已投／已退出</option></select><select id="manageFilter" aria-label="管理分组"><option value="">全部管理分组</option><option value="pipeline">在手推进</option><option value="portfolio">投后跟踪</option></select><select id="sectorFilter" aria-label="领域"><option value="">全部领域</option></select><select id="schoolFilter" aria-label="学校与机构"><option value="">全部学校／机构</option></select><button id="resetFilters" title="清除筛选">重置</button></section>
<div class="workspace"><section id="content" class="content"></section><aside id="rightRail" class="right-rail"></aside></div>
<footer><span>以公司为中心 · 保留每一轮投资与每一次变化</span><span>内部资料与公开研究分别标示 · 空白不等于零</span></footer></main>

function normalizeSchool(s){s=String(s||'').trim().replace(/^官网[：:]\s*/,'').replace(/（原始记录）/g,'');if(s.includes('（官网）'))s=s.split('（官网）')[0];return Object.keys(schoolNames).find(k=>schoolNames[k]===s)||s} function schools(c){return uniq([...(c.schoolOverride?[]:[...vals(c,'所属学校'),...vals(c,'外部机构/学校/券商')]),c.school,...c.people.map(p=>p.school)].flatMap(s=>String(s||'').split(/[；;]/)[0].replace(/（[^）]*）/g,m=>/广州|深圳/.test(m)?m:'').split(/[,，]/)).map(normalizeSchool).filter(s=>s&&!/其他|待核|未知|未注明|项目库标/.test(s)))}

function fmtTime(t){try{return new Date(t).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false})}catch{return String(t)}}
function metricCard(m){return `<div class="metric-card"><div class="metric-title">${esc(m.label)} ${m.basis?`· ${esc(m.basis)}`:''}</div><div class="metric-value">${esc(Number(m.value).toLocaleString('zh-CN',{maximumFractionDigits:6}))}<span style="font-size:12px"> ${esc(m.unit)} ${esc(m.currency)}</span></div><div class="metric-meta">${esc(m.period||m.round||'期间待补')} · ${esc(m.kind)}<br>截至 ${esc(m.asOf)}${m.round&&m.period?' · '+esc(m.round):''}</div><button class="edit-metric" data-edit-metric="${m.id}" aria-label="编辑${esc(m.label)}">✎</button></div>`}
function changeText(h){if(h.kind==='metric'){const m=h.after||h.before;if(!m)return '撤销数字更新';return `${h.before?'修正':'新增'} ${m.label} ${m.period||m.round||''}：${h.before?h.before.value+' → ':''}${m.value} ${m.unit} ${m.currency}`.trim()}if(h.kind==='event')return '记录项目进展：'+(h.after?.text||'');if(h.kind==='decision')return `${h.before?'更新':'新增'}决议事项：${h.after?.title||''}（${h.after?.status||''}）`;if(h.kind==='undo')return '撤销最近一次手动修改';if(h.kind==='import')return '导入数据包';return h.note||'数据更新'}
function metricForm(id='',preset=''){const c=data.companies.find(c=>c.id===selected),existing=c.metrics.find(m=>m.id===id),m=existing||{label:preset||'营业收入',value:'',currency:'CNY',unit:'万元',period:'',round:'',basis:'',kind:'实际',asOf:today(),note:''};openModal(modalHead(existing?'修正这个数字':'新增一期／一个指标')+`<form id="metricForm"><div class="form-grid"><label class="form-field full">指标名称<input name="label" list="metricNames" required maxlength="60" value="${esc(m.label)}"><datalist id="metricNames">${['目标融资额','已到账融资额','投前估值','投后估值','营业收入','净利润','累计投入','累计回款','剩余投资成本','持仓市值'].map(v=>`<option value="${v}">`).join('')}</datalist></label><label class="form-field">数值<input name="value" type="number" step="any" required autofocus value="${esc(m.value)}"></label><label class="form-field">币种<select name="currency">${['CNY','HKD','USD','EUR','其他'].map(v=>`<option ${v===m.currency?'selected':''}>${v}</option>`).join('')}</select></label><label class="form-field">单位<select name="unit">${['元','万元','百万元','亿元'].map(v=>`<option ${v===m.unit?'selected':''}>${v}</option>`).join('')}</select></label><label class="form-field">数据性质<select name="kind">${['实际','预测','目标','待核实'].map(v=>`<option ${v===m.kind?'selected':''}>${v}</option>`).join('')}</select></label><label class="form-field">所属期间<input name="period" placeholder="如 2026 全年／2026 Q3／2026 前三季度" value="${esc(m.period)}"></label><label class="form-field">融资／投资轮次<input name="round" placeholder="如 创始轮／B轮／2026 增资" value="${esc(m.round)}"></label><label class="form-field">口径补充<input name="basis" placeholder="如 合并报表／归母／投前" value="${esc(m.basis)}"></label><label class="form-field">截至日期<input name="asOf" type="date" required value="${esc(m.asOf)}"></label><label class="form-field full">备注／来源<textarea name="note" placeholder="如 CFO 周会口述，待报表确认">${esc(m.note)}</textarea></label></div><p class="form-help">${existing?'这是对当前记录的修正，旧值将保留在历史中。新增季度请取消后选择“新一期／新指标”。':'营收与利润必须注明期间；融资与估值必须注明轮次。不同币种不自动折算。'}</p><div id="formError" class="error-text"></div><div class="form-actions"><button type="button" data-action="close-modal">取消</button><button class="primary" type="submit">✓ 确认并保存本机</button></div></form>`);$('#metricForm').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),value=Number(f.value);if(!Number.isFinite(value)||String(f.value).trim()===''){return $('#formError').textContent='请输入有效数字；未知请保留待补充，不能填写 0 代替。'}if(/营收|营业收入|利润/.test(f.label)&&!f.period.trim())return $('#formError').textContent='请注明财务期间，例如 2026 Q3。';if(/融资|估值/.test(f.label)&&!f.round.trim())return $('#formError').textContent='请注明对应融资轮次。';if(value<0&&!/利润|损益|亏损|现金流/.test(f.label))return $('#formError').textContent='该金额不能为负；负利润请使用利润指标。';const result={...f,value,id:id||uid(),updatedAt:now()};if(c.metrics.some(n=>n.id!==id&&n.label===result.label&&n.period===result.period&&n.round===result.round&&n.basis===result.basis&&n.currency===result.currency&&n.kind===result.kind))return $('#formError').textContent='相同指标与期间已存在，请使用该卡片上的铅笔修正。';const before=existing?clone(existing):null;if(existing)c.metrics[c.metrics.indexOf(existing)]=result;else c.metrics.push(result);closeModal();logChange(c.id,'metric',result.id,before,result,f.note);toast(storageOK?'数字已保存到本机。导出新版可用于发布。':'本地存储不可用，请立即导出。')}}
function updateForm(){const opts=data.companies.map(c=>`<option value="${c.id}" ${c.id===selected?'selected':''}>${esc(c.name)}</option>`).join('');openModal(modalHead('记录项目更新')+`<form id="updateForm"><div class="form-grid"><label class="form-field full">公司<select name="companyId">${opts}</select></label><label class="form-field">发生日期<input name="date" type="date" required value="${today()}"></label><label class="form-field">更新类型<select name="category"><option>项目进展</option><option>融资推进</option><option>投后经营</option><option>退出／回款</option><option>法律事项</option></select></label><label class="form-field full">发生了什么<textarea name="text" required autofocus></textarea></label><label class="form-field full">下一步<textarea name="next"></textarea></label><label class="form-field">负责人<input name="owner"></label><label class="form-field">截止日期<input name="deadline" type="date"></label><label class="form-field full">来源<input name="source" placeholder="如 11 月 9 日周会纪要" value="手动记录"></label></div><div class="form-actions"><button type="button" data-action="close-modal">取消</button><button class="primary">✓ 保存更新</button></div></form>`);$('#updateForm').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),c=data.companies.find(c=>c.id===f.companyId);delete f.companyId;f.id=uid();f.recordedAt=now();c.events.push(f);closeModal();logChange(c.id,'event',f.id,null,f);toast('进展已记录，可在“本周更新”查看')}}
function decisionForm(id=''){const c=data.companies.find(c=>c.id===selected),existing=c.decisions.find(d=>d.id===id),d=existing||{title:'',status:'待讨论',owner:'',deadline:'',note:''};openModal(modalHead(existing?'更新决议事项':'添加待决议事项')+`<form id="decisionForm"><div class="form-grid"><label class="form-field full">需要决定什么<textarea name="title" required autofocus>${esc(d.title)}</textarea></label><label class="form-field">状态<select name="status">${['待讨论','已决议','暂缓'].map(s=>`<option ${s===d.status?'selected':''}>${s}</option>`).join('')}</select></label><label class="form-field">负责人<input name="owner" value="${esc(d.owner)}"></label><label class="form-field">截止日期<input name="deadline" type="date" value="${esc(d.deadline)}"></label><label class="form-field full">讨论依据／决议结论<textarea name="note">${esc(d.note)}</textarea></label></div><div id="formError" class="error-text"></div><div class="form-actions"><button type="button" data-action="close-modal">取消</button><button class="primary">✓ 保存事项</button></div></form>`);$('#decisionForm').onsubmit=e=>{e.preventDefault();const f={...Object.fromEntries(new FormData(e.target)),id:id||uid(),updatedAt:now()};if(f.status==='已决议'&&!f.note.trim())return $('#formError').textContent='请填写决议结论，避免状态与内容不一致。';const before=existing?clone(existing):null;if(existing)c.decisions[c.decisions.indexOf(existing)]=f;else c.decisions.push(f);closeModal();logChange(c.id,'decision',f.id,before,f);toast('决议事项已保存')}}
function download(name,content,type){const u=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}
function exportData(){const out=clone(data);out.version=data.version.split('+')[0]+'+local-'+new Date().toISOString().replace(/[-:.TZ]/g,'');out.exportedAt=now();return out}
function exportHTML(){const doc=document.documentElement.cloneNode(true);doc.querySelector('#app-data').textContent=JSON.stringify(exportData()).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');doc.querySelector('#modal').removeAttribute('open');doc.querySelector('#modalContent').innerHTML='';doc.querySelector('#drawer').hidden=true;doc.querySelector('#drawer').innerHTML='';doc.querySelector('#drawerBackdrop').hidden=true;doc.querySelector('#toast').hidden=true;doc.querySelector('body').style.overflow='';doc.querySelector('#content').innerHTML='';doc.querySelector('#rightRail').innerHTML='';download('index.html','<!doctype html>\n'+doc.outerHTML,'text/html;charset=utf-8');toast('已下载完整 HTML。请使用下载的新文件替换发布版本。')}
function dataMenu(){openModal(modalHead('数据与导出')+`<p class="form-help">当前版本 ${esc(data.version)} · ${data.companies.length} 个项目 · ${dirtyCount()} 项本机未发布修改。手机与电脑的浏览器存储彼此独立。</p>${!storageOK?'<div class="notice">本地存储不可用，当前改动仅在此页面，请及时导出。</div>':''}<div class="menu-actions"><button data-action="export-html">导出更新后的 HTML<small>完整离线网页 · 文件名 index.html</small></button><button data-action="export-json">导出数据包<small>将最新数据交给 AI 或迁移至另一设备</small></button><button data-action="import-json">导入数据包<small>先预览版本与差异，不静默覆盖</small></button><button data-action="undo" ${!undoCandidate()?'disabled':''}>撤销最近一次修改<small>恢复原值，保留撤销记录</small></button></div><div class="notice">本机保存不会直接修改原文件或 GitHub。发布前下载新版 index.html；每周向 AI 提交纪要时，附上最新数据包，以保留你的手动修改。</div><p class="form-help">完整网页和数据包含内部投资信息，请保存在你认可的访问范围内。</p>`)}
function undoCandidate(){return [...data.history].reverse().find(h=>['metric','event','decision'].includes(h.kind)&&!data.history.some(u=>u.kind==='undo'&&u.targetId===h.id))}
function undo(){const h=undoCandidate();if(!h)return;const c=data.companies.find(c=>c.id===h.companyId),key={metric:'metrics',event:'events',decision:'decisions'}[h.kind],idx=c[key].findIndex(x=>x.id===h.targetId);if(h.before){if(idx>=0)c[key][idx]=clone(h.before);else c[key].push(clone(h.before))}else if(idx>=0)c[key].splice(idx,1);closeModal();logChange(c.id,'undo',h.id,h.after,h.before,'撤销：'+changeText(h));toast('已撤销，历史记录仍保留')}
function validatePackage(x){
 const obj=v=>v&&typeof v==='object'&&!Array.isArray(v),str=v=>typeof v==='string',arr=(v,n)=>{if(!Array.isArray(v))throw Error('缺少数组字段：'+n)},strings=(v,n)=>{arr(v,n);if(v.some(t=>!str(t)))throw Error(n+' 必须是文本列表')};
 if(!obj(x)||x.schemaVersion!==1||!str(x.version)||!x.version||!Number.isInteger(x.sourceRecordCount))throw Error('数据包结构或版本不支持。');
 arr(x.companies,'companies');arr(x.history,'history');const ids=new Set(),records=new Set();
 for(const c of x.companies){
  if(!obj(c)||!str(c.id)||!c.id||ids.has(c.id)||!str(c.name)||!c.name)throw Error('公司 ID／名称缺失或重复。');ids.add(c.id);
  if(c.currentStatus!=null&&(!obj(c.currentStatus)||!str(c.currentStatus.text)||!str(c.currentStatus.date)||(c.currentStatus.pipeline!=null&&typeof c.currentStatus.pipeline!=='boolean')))throw Error('currentStatus 结构不合法。');
  if(c.schoolOverride!=null&&typeof c.schoolOverride!=='boolean')throw Error('schoolOverride 必须为布尔值。');
  if(c.websiteStatus!=null&&!str(c.websiteStatus))throw Error('websiteStatus 必须为文本。');
  if(c.entityNotes!=null&&!str(c.entityNotes)){strings(c.entityNotes,'entityNotes');}
  for(const k of ['records','metrics','events','decisions','people','sources'])arr(c[k],k);
  for(const k of ['gaps','products','aliases','queries'])strings(c[k],k);
  if(!str(c.summary)||!str(c.subsector)||!str(c.sector)||!sectorOrder.includes(c.sector)||!obj(c.review)||!str(c.review.focus))throw Error(c.name+' 缺少简介、领域或复盘。');strings(c.review.questions,'review.questions');
  for(const r of c.records){if(!obj(r)||!str(r.recordId)||records.has(r.recordId))throw Error('原始记录 ID 不合法或重复');records.add(r.recordId);if(Object.values(r).some(v=>!str(v)))throw Error('原始记录字段必须是文本');}
  for(const p of c.people)if(!obj(p)||!str(p.name)||['role','school','department','sourceUrl'].some(k=>p[k]!=null&&!str(p[k])))throw Error('人物资料结构不合法。');
  for(const source of c.sources)if(!obj(source)||!str(source.url)||(source.title!=null&&!str(source.title)))throw Error('资料来源结构不合法。');
  const mids=new Set(),mkeys=new Set();
  for(const m of c.metrics){if(!obj(m)||typeof m.value!=='number'||!Number.isFinite(m.value)||!str(m.id)||!m.id||mids.has(m.id)||['label','currency','unit','period','round','basis','kind','asOf'].some(k=>!str(m[k])))throw Error('财务指标结构、数值或 ID 不合法。');mids.add(m.id);const key=[m.label,m.period,m.round,m.basis,m.currency,m.kind].join('|');if(mkeys.has(key))throw Error('存在相同期间与口径的重复财务指标。');mkeys.add(key);}
  const eids=new Set();for(const e of c.events){if(!obj(e)||!str(e.id)||eids.has(e.id)||!str(e.date)||!/^\d{4}-\d{2}-\d{2}$/.test(e.date)||!str(e.text)||!str(e.category))throw Error('进展事件结构不合法。');eids.add(e.id);}
  const dids=new Set();for(const d of c.decisions){if(!obj(d)||!str(d.id)||dids.has(d.id)||!str(d.title)||!['待讨论','已决议','暂缓'].includes(d.status))throw Error('决议事项结构不合法。');dids.add(d.id);}
 }
 if(x.weeklyImports!=null){arr(x.weeklyImports,'weeklyImports');for(const m of x.weeklyImports){if(!obj(m)||(m.date!=null&&!str(m.date)))throw Error('周会记录结构不合法。');for(const k of ['unresolved','crossProject'])if(m[k]!=null){arr(m[k],k);for(const item of m[k])if(!str(item)&&(!obj(item)||['name','text','next','owner','deadline','reason','possibleMatch','sourceTime'].some(f=>item[f]!=null&&!str(item[f]))))throw Error(k+' 事项结构不合法。');}if(m.excluded!=null)strings(m.excluded,'excluded');}}
 if(records.size!==x.sourceRecordCount)throw Error('原始记录数量与声明不一致。');
 for(const h of x.history)if(!obj(h)||!str(h.id)||!str(h.kind)||!str(h.at)||!str(h.companyId)||!ids.has(h.companyId))throw Error('修改历史引用不合法。');
 return x;
}
function changedCount(a,b){return b.companies.filter(c=>JSON.stringify(a.companies.find(x=>x.id===c.id))!==JSON.stringify(c)).length}
async function importFile(file){if(!file)return;try{if(file.size>30*1024*1024)throw Error('数据包过大，请使用 30 MB 以下 JSON。');const incoming=validatePackage(JSON.parse(await file.text()));openModal(modalHead('预览数据包导入')+`<p>当前版本：${esc(data.version)}<br>待导入：${esc(incoming.version)}</p><p class="form-help">${incoming.companies.length} 个项目，${changedCount(data,incoming)} 个项目与当前数据不同。导入将采用这个完整数据包；当前数据会先下载为备份，避免丢失本机修改。</p><div class="notice">如果两台设备都修改过，请先导出各自数据交给 AI 合并，不要用整包替换代替合并。</div><div class="form-actions"><button data-action="close-modal">取消</button><button id="confirmImport" class="primary">备份当前数据并导入</button></div>`);$('#confirmImport').onclick=()=>{download('before-import-'+today()+'.json',JSON.stringify(data,null,2),'application/json');try{localStorage.setItem(storageKey+'-backup',JSON.stringify(data))}catch{}data=clone(incoming);base=clone(incoming);selected=null;closeDrawer();closeModal();fillFilters();save();render();toast('数据包已导入；导入前备份已下载。')}}catch(e){toast('导入失败：'+e.message)}finally{$('#importFile').value=''}}
function recoverLocal(){try{const raw=localStorage.getItem(storageKey);if(raw)savedEnvelope=JSON.parse(raw);if(savedEnvelope){validatePackage(savedEnvelope.data);if(savedEnvelope.baseVersion===embedded.version){data=clone(savedEnvelope.data);base=clone(savedEnvelope.base||embedded)}else if(JSON.stringify(savedEnvelope.data)===JSON.stringify(savedEnvelope.base)){savedEnvelope=null}}}catch{storageOK=false;savedEnvelope=null}}
function showVersionConflict(){if(!savedEnvelope||savedEnvelope.baseVersion===embedded.version)return;const local=savedEnvelope.data;versionConflictPending=true;try{localStorage.setItem(storageKey+'-conflict-backup-'+Date.now(),JSON.stringify(savedEnvelope))}catch{storageOK=false}openModal(modalHead('检测到另一个版本的本机数据')+`<p class="form-help">网页版本 ${esc(embedded.version)}<br>本机数据基于 ${esc(savedEnvelope.baseVersion)}。为避免旧缓存覆盖新版，没有自动套用。</p><div class="notice">先导出旧本机数据作为备份，再选择要继续查看的版本。需要合并时把两个数据包交给 AI，手动数字不会被悄悄丢弃。</div><div class="menu-actions"><button id="backupLocal">下载旧本机数据<small>建议先保存，再选择版本</small></button><button id="useNew">使用当前网页版本<small>本机旧版另存一份备份</small></button><button id="useOld">继续旧本机版本<small>当前网页新数据暂不采用</small></button></div>`);$('#backupLocal').onclick=()=>download('local-backup-'+today()+'.json',JSON.stringify(local,null,2),'application/json');$('#useNew').onclick=()=>{try{localStorage.setItem(storageKey+'-backup',JSON.stringify(savedEnvelope))}catch{}data=clone(embedded);base=clone(embedded);versionConflictPending=false;save();closeModal();fillFilters();render()};$('#useOld').onclick=()=>{data=clone(local);base=clone(savedEnvelope.base||embedded);versionConflictPending=false;save();closeModal();fillFilters();render()}}
document.addEventListener('click',e=>{if(e.target.closest('summary,.source-detail'))return;const t=e.target.closest('button,a,[data-company],[data-group],[data-action]');if(!t)return;if(t.closest('.week-jumps')&&t.tagName==='A'){e.preventDefault();document.querySelector(t.getAttribute('href'))?.scrollIntoView({block:'start'});return}if(t.dataset.company){openCompany(t.dataset.company);return}if(t.dataset.view){view=t.dataset.view;render();return}if(t.dataset.layout){layout=t.dataset.layout;schoolFocus='';pan={x:0,y:0,k:1};render();return}if(t.dataset.group){if(layout==='sector'){if(sectorOrder.includes(t.dataset.group)){$('#sectorFilter').value=t.dataset.group;render()}else{search=t.dataset.group;$('#search').value=search;render()}}else{schoolFocus=t.dataset.group;pan={x:0,y:0,k:1};render()}return}if(t.dataset.editMetric){metricForm(t.dataset.editMetric);return}if(t.dataset.newMetric){metricForm('',t.dataset.newMetric);return}if(t.dataset.editDecision){decisionForm(t.dataset.editDecision);return}const action=t.dataset.action;if(!action)return;const actions={'close-modal':closeModal,'close-drawer':closeDrawer,'view-weekly':()=>{view='weekly';render()},'view-list':()=>{view='list';render()},'view-quality':()=>{view='quality';render()},'school-back':()=>{schoolFocus='';render()},'zoom-in':()=>{pan.k=Math.min(4,pan.k*1.2);applyPan()},'zoom-out':()=>{pan.k=Math.max(.45,pan.k/1.2);applyPan()},'reset-graph':()=>{schoolFocus='';pan={x:0,y:0,k:1};render()},'add-metric':()=>metricForm(),'add-update':updateForm,'add-decision':()=>decisionForm(),'export-html':exportHTML,'export-json':()=>{download('project-universe-'+today()+'.json',JSON.stringify(exportData(),null,2),'application/json');toast('数据包已导出。')},'import-json':()=>{closeModal();$('#importFile').click()},undo};actions[action]?.()});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();$('#search').focus()}if(e.key==='Escape'&&!$('#modal').open)closeDrawer();if((e.key==='Enter'||e.key===' ')&&(e.target.dataset.company||e.target.dataset.group||e.target.dataset.action==='school-back')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
$('#drawerBackdrop').onclick=closeDrawer;$('#dataMenuButton').onclick=dataMenu;$('#search').oninput=e=>{search=e.target.value.trim();render()};['investFilter','manageFilter','sectorFilter','schoolFilter'].forEach(id=>$('#'+id).onchange=()=>{schoolFocus='';render()});$('#resetFilters').onclick=()=>{search='';$('#search').value='';['investFilter','manageFilter','sectorFilter','schoolFilter'].forEach(id=>$('#'+id).value='');schoolFocus='';pan={x:0,y:0,k:1};render()};$('#importFile').onchange=e=>importFile(e.target.files[0]);
$('#modal').addEventListener('cancel',e=>{if(versionConflictPending)e.preventDefault()});
$('#modal').addEventListener('close',()=>{if(versionConflictPending)$('#modal').showModal()});
document.addEventListener('keydown',e=>{if(versionConflictPending&&e.key==='Escape'){e.preventDefault();e.stopPropagation()}},true);
recoverLocal();fillFilters();render();showVersionConflict();
